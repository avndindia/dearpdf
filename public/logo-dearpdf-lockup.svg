<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 88" fill="none">
  <defs>
    <linearGradient id="doc_grad_tight" x1="12" y1="8" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="fold_grad_tight" x1="44" y1="8" x2="68" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="pdf_shadow_tight" x="2" y="4" width="80" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON: Crisp folded PDF document -->
  <g transform="translate(6, 6)" filter="url(#pdf_shadow_tight)">
    <path d="M16 10 C16 6.686 18.686 4 22 4 H46 L68 26 V66 C68 69.314 65.314 72 62 72 H22 C18.686 72 16 69.314 16 66 V10 Z" fill="url(#doc_grad_tight)"/>
    <path d="M46 4 L68 26 H52 C48.686 26 46 23.314 46 20 V4 Z" fill="url(#fold_grad_tight)"/>
    <path d="M46 20 L68 26 H46 Z" fill="#0C4A6E" opacity="0.3"/>

    <rect x="22" y="34" width="40" height="18" rx="4.5" fill="#FFFFFF"/>
    <text x="42" y="47.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#0284C7" text-anchor="middle" letter-spacing="0.06em">
      PDF
    </text>

    <rect x="22" y="57" width="22" height="3" rx="1.5" fill="#BAE6FD" fill-opacity="0.9"/>
    <rect x="48" y="57" width="14" height="3" rx="1.5" fill="#38BDF8" fill-opacity="0.9"/>
  </g>

  <!-- UNIFIED WORDMARK: Ultra-tight inline .in with negative tracking / kerning right touching PDF -->
  <text x="86" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.04em" fill="#0F172A">
    Dear<tspan fill="#0284C7" font-weight="900">PDF</tspan><tspan fill="#0284C7" font-weight="800" font-size="28" letter-spacing="-0.05em" dx="-1">.in</tspan>
  </text>
</svg>